[project]
name = "algo-trading-ingestor"
version = "0.1.0"
description = "Market-data gateway: normalises bar-close events from MT5 (and later Binance) and publishes them one-way to NATS"
authors = []
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "nats-py>=2.9.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.27.0",
    # IANA zones for zoneinfo — Windows ships none, and MT5 server time is
    # converted to UTC through one.
    "tzdata>=2024.1",
    # The MT5 terminal bridge only exists as a Windows wheel.
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestor"]

[tool.ruff]
line-length = 88
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"
